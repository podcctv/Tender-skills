interface:
  display_name: "投标方案编制"
  short_description: "审标、投标文件格式、签章提交、资料清单、分章 DOCX 和真人投标语感改写"
  default_prompt: "Use $tender-bid-writer to audit the tender package. Apply tender-native format and submission requirements first; use cn-government-procurement-bid-format defaults only when the tender is silent. If this is an outsourced bid, first produce 资料清单（项目名称）.docx and 标书组织说明（项目名称）.md. Before drafting, rebalance chapter structure, thicken the six excellence topics when relevant, and place正文 under leaf headings. When finalizing Word chapters, use 投标文档格式.docx if available and output separate DOCX files under 分章节定稿. When drafting or revising formal chapters, remove AI-like template phrasing and write with purchaser scenes, responsible roles, process records, issue handling, and acceptance materials."
